packages:
  - 'packages/backend'
  - 'packages/frontend'
  - 'packages/misskey-js'
allowBuilds:
  '@parcel/watcher': true
  '@nestjs/core': true
  '@parcel/watcher': set this to true or false
  '@swc/core': true
  bufferutil: true
  cypress: true
