packages:
  - 'packages/backend'
  - 'packages/frontend'
  - 'packages/misskey-js'
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  bufferutil: true
  cypress: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  re2: true
  sharp: true
  utf-8-validate: true

overrides:
  # sanitize-html 2.18 pulls htmlparser2 ^12, which is ESM-only (no `require`
  # export). Jest loads sanitize-html through require(), so every suite that
  # touches it dies with "Must use import to load ES Module". htmlparser2 10.x
  # ships both module formats and keeps the sanitize-html security bump.
  htmlparser2: 10.1.0
