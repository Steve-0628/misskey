# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test (misskey.js)

# Cancel superseded runs: Renovate rebases and rapid merges would otherwise
# queue a full matrix of jobs for every intermediate commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ steskey ]
  pull_request:
    branches: [ steskey ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: pnpm i --frozen-lockfile && git diff --exit-code pnpm-lock.yaml

      - name: Install dependencies (PR)
        if: github.event_name == 'pull_request'
        run: pnpm i --no-frozen-lockfile

      - name: Build
        run: pnpm --filter misskey-js build

      - name: Test
        run: pnpm --filter misskey-js test
        env:
          CI: true
