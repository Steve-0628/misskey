name: Test (frontend)

# Cancel superseded runs: Renovate rebases and rapid merges would otherwise
# queue a full matrix of jobs for every intermediate commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - steskey
  pull_request:
    paths:
      - '**'
      - '!pnpm-lock.yaml'
      - '!packages/backend/**'

jobs:
  vitest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    - name: Use Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: corepack enable
    - if: github.event_name != 'pull_request'
      run: pnpm i --frozen-lockfile && git diff --exit-code pnpm-lock.yaml
    - if: github.event_name == 'pull_request'
      run: pnpm i --no-frozen-lockfile
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm --filter frontend test-and-coverage

  e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    # https://github.com/cypress-io/cypress-docker-images/issues/150
    #- name: Install mplayer for FireFox
    #  run: sudo apt install mplayer -y
    #  if: ${{ matrix.browser == 'firefox' }}
    #- uses: browser-actions/setup-firefox@latest
    #  if: ${{ matrix.browser == 'firefox' }}
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    - name: Use Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: corepack enable
    - if: github.event_name != 'pull_request'
      run: pnpm i --frozen-lockfile
    - if: github.event_name == 'pull_request'
      run: pnpm i --no-frozen-lockfile
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    # https://github.com/cypress-io/cypress/issues/4351#issuecomment-559489091
    - name: ALSA Env
      run: echo -e 'pcm.!default {\n type hw\n card 0\n}\n\nctl.!default {\n type hw\n card 0\n}' > ~/.asoundrc
    # XXX: This tries reinstalling Cypress if the binary is not cached
    # Remove this when the cache issue is fixed
    - name: Cypress install
      run: pnpm exec cypress install
    - name: Cypress run
      uses: cypress-io/github-action@v7.4.6
      with:
        install: false
        start: pnpm start:test
        wait-on: 'http://localhost:61812'
        headed: true
        browser: ${{ matrix.browser }}
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: ${{ matrix.browser }}-cypress-screenshots
        path: cypress/screenshots
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.browser }}-cypress-videos
        path: cypress/videos
